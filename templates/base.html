<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Acuario Vaporeon{% endblock %}
    </title>

    <!-- CSS Propio -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <!-- ===== HEADER ===== -->

    <header class="bg-dark text-white py-4 text-center shadow-sm w-100 m-0">

        <div class="container">

            <h1 class="display-5 fw-bold text-info">
                Acuario Vaporeon
            </h1>

            <p class="lead text-light opacity-75 mb-0">
                Sistema de Gestión de Ventas de Acuariofilia en Ecuador
            </p>

        </div>

    </header>


    <!-- ===== NAVBAR REUTILIZABLE ===== -->

    {% include "components/navbar.html" %}


    <!-- ===== CONTENIDO ===== -->

    <main>

        {% block content %}{% endblock %}

    </main>


    <!-- ===== FOOTER REUTILIZABLE ===== -->

    {% include "components/footer.html" %}


    <!-- ===== SCRIPTS ===== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
